# Pipeline de despliegue de Keycloak.
#
# QUÉ HACE
#   Apunta la Container App de Keycloak del entorno elegido a la imagen pública de Phase Two (quay.io)
#   y la arranca en modo producción. El disparo es manual: un developer elige el entorno y lo lanza.
#
# QUÉ NO HACE
#   - No construye ninguna imagen: no hay Dockerfile y la imagen no es nuestra.
#   - No publica nada en nuestro Azure Container Registry. La imagen se descarga de quay.io, que es
#     público, así que esta pipeline no necesita permiso de escritura sobre el registro.
#   - No toca variables de entorno, secretos, ingress ni escala: eso lo gobierna Terraform
#     (devops/iac). Aquí solo cambian la imagen, el comando y los argumentos.
#
# PERMISO QUE NECESITA LA IDENTIDAD
#   Poder actualizar la Container App: Contributor sobre ella o sobre el grupo de recursos
#   socialschool-rg-<entorno>. El alta de la federación OIDC está en devops/README.md.
#
# CONVENCIÓN DE NOMBRES (la misma que Terraform; ver devops/iac/README.md)
#   grupo de recursos   socialschool-rg-<entorno>
#   Container App       socialschool-keycloak-<entorno>
#   registro            socialschoolacr<entorno>   <- esta pipeline NO lo usa
#
# VARIABLES DEL REPOSITORIO QUE HAY QUE DEFINIR
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   Son identificadores, no credenciales: con OIDC no se guarda ningún secreto.

name: Keycloak

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno sobre el que desplegar Keycloak
        required: true
        type: choice
        default: develop
        options:
          - develop
          - qa
          - production

permissions:
  id-token: write # necesario para pedir el token federado
  contents: read

# Dos ejecuciones sobre el mismo entorno a la vez se pisarían.
concurrency:
  group: keycloak-${{ inputs.environment }}

env:
  # La imagen y la forma de arrancar son de esta pipeline: la imagen de Phase Two arranca en modo
  # desarrollo por defecto y, sin `start`, usaría su base de datos embebida en lugar de MySQL.
  KEYCLOAK_IMAGE: quay.io/phasetwo/phasetwo-keycloak:26.8.0.1790930320
  KEYCLOAK_COMMAND: /opt/keycloak/bin/kc.sh
  KEYCLOAK_ARGS: start

jobs:
  deploy:
    name: Desplegar Keycloak en ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Iniciar sesión en Azure (OIDC, sin secretos)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apuntar la Container App a la imagen de Keycloak
        run: |
          az containerapp update \
            --resource-group "socialschool-rg-${{ var.ENVIRONMENT_PREFIX }}" \
            --name "socialschool-keycloak-${{ var.ENVIRONMENT_PREFIX }}" \
            --image "$KEYCLOAK_IMAGE" \
            --command "$KEYCLOAK_COMMAND" \
            --args "$KEYCLOAK_ARGS"

      - name: Mostrar la imagen que ha quedado desplegada
        run: |
          az containerapp show \
            --resource-group "socialschool-rg-${{ var.ENVIRONMENT_PREFIX }}" \
            --name "socialschool-keycloak-${{ var.ENVIRONMENT_PREFIX }}" \
            --query "properties.template.containers[0].image" \
            --output tsv
