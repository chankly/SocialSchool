<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cliente web de SocialSchool, construido con Blazor WebAssembly." />
    <title>SocialSchool · Cliente web</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="boot">
            <span class="boot-mark">SS</span>
            <p class="boot-title">SocialSchool</p>
            <p class="boot-text">Cargando el cliente web…</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        Se ha producido un error inesperado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">✕</a>
    </div>

    <!-- El paquete OIDC no trae inicializador de JS: publica el global `AuthenticationService`
         con este script, que tiene que ejecutarse antes de arrancar Blazor. -->
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

</body>

</html>
